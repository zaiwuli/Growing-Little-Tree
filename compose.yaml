services:
  growing-little-tree:
    image: ghcr.io/zaiwuli/growing-little-tree:latest
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - growth-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  growth-data:
